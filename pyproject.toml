[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent"
version = "0.1.0"
description = "A replaceable web Agent harness backed by a remote MCP workspace"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["client*", "server*", "common*"]

[tool.setuptools.package-data]
client = ["static/*"]
server = ["skills/*/SKILL.md", "skills/*/scripts/*.py"]
